<h1>【公示】2021-2022-1学期日本创价大学双学位项目拟推荐名单</h1><div class=m>国际项目·双学位项目 · 2021-06-23</div>
<p>各位同学：</p><p>2021-2022-1学期日本创价大学双学位项目校内报名及审核已经结束，黄礼鸿等5名同学作为学校推荐名单（具体名单见附件）进入下一轮选拔。</p><p>请各位进入学校推荐名单的同学，仔细阅读报名通知的流程安排及要求，按外方要求准时提交材料。</p><h2>附件</h2><div class=att><a href="https://internationaloffice.gdufs.edu.cn/system/_content/download.jsp?urltype=news.DownloadAttachUrl&amp;owner=1175763397&amp;wbfileid=B11145BE75DA438802795DE54EE8FF72">📎 2021-2022-1学期日本创价大学双学位项目拟推荐名单（5人）.xls</a></div><h2>原文</h2><p><a href="https://internationaloffice.gdufs.edu.cn/info/1014/8727.htm">在学校网站打开（电脑版）</a></p></main></body></html>
