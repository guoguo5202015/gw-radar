<h1>【秋季项目公示】2023-2024-1学期澳大利亚昆士兰大学联合培养项目拟推荐名单</h1><div class=m>国际项目·双学位项目 · 2023-04-07</div>
<p>关于2023-2024-1秋季学期选拔赴澳大利亚昆士兰大学联合培养双学位项目校内报名及审核已经结束，聂祯妍等5名同学作为学校推荐名单（具体名单见附件）进入下一轮选拔。</p><p>请各位进入学校推荐名单的同学，仔细阅读报名通知的流程安排及要求，按外方要求准时提交材料。</p><h2>附件</h2><div class=att><a href="https://internationaloffice.gdufs.edu.cn/system/_content/download.jsp?urltype=news.DownloadAttachUrl&amp;owner=1175763397&amp;wbfileid=B415FC75BE60236243EE5231A789FFA5">📎 2023-2024-1学期澳大利亚昆士兰大学联合培养项目拟推荐名单.xls</a></div><h2>原文</h2><p><a href="https://internationaloffice.gdufs.edu.cn/info/1014/9894.htm">在学校网站打开（电脑版）</a></p></main></body></html>
