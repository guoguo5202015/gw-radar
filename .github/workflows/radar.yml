name: 广外通知雷达

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟一次（GitHub 高峰期可能延迟几分钟）
  workflow_dispatch:          # 允许在网页上手动点“Run workflow”

permissions:
  contents: write
  pages: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python gw_notify.py
      - name: 保存记录和网页
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen.json docs/index.html
          git diff --cached --quiet || git commit -m "更新通知 $(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
          git push
      - name: 重新发布网页
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds | head -c 300 || true
